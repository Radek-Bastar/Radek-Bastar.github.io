<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje první stránka s videem</title>
    <style>
        
        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .live-text {
            text-align: left;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1  style="text-align: center;">Video z pořadu Sama doma 11. 2. 2025</h1>
    </header>
   
    <main>
        <section class="video-container">
            <!-- Vložení YouTube videa -->
            <iframe 
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/m3_0vXOHC7Y" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
            <p class="live-text"><br>Byl to živý přenos, Takže co se vypustí do světa, už se to nedá vrátit<span>&#128518;</span></p>
        </section>
    </main>
</body>
</html>
